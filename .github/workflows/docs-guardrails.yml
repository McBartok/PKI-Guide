name: Docs Guardrails

on:
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - ".github/workflows/docs-guardrails.yml"
      - ".github/workflows/pages-deploy.yml"
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "README.md"
      - ".github/workflows/docs-guardrails.yml"
      - ".github/workflows/pages-deploy.yml"

permissions:
  contents: read

jobs:
  build-docs:
    name: Build docs site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate diagram images
        run: |
          mkdir -p docs/assets/img
          cat << 'EOF' > /tmp/puppeteer-config.json
          {
            "args": ["--no-sandbox", "--disable-setuid-sandbox"]
          }
          EOF
          npx -y @mermaid-js/mermaid-cli -p /tmp/puppeteer-config.json -i docs/diagrams/tls13-server-auth.mmd -o docs/assets/img/tls13-server-auth.svg -b transparent
          npx -y @mermaid-js/mermaid-cli -p /tmp/puppeteer-config.json -i docs/diagrams/mtls-auth.mmd -o docs/assets/img/mtls-auth.svg -b transparent

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Jekyll and plugins
        run: |
          gem install jekyll -v "~> 4.3"
          gem install jekyll-remote-theme
          gem install jekyll-seo-tag
          gem install jekyll-include-cache
          gem install jekyll-relative-links

      - name: Build site from docs/
        run: jekyll build --source docs --destination _site

  check-links:
    name: Check markdown links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --exclude-mail
            --base docs
            README.md docs/**/*.md
